name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Buf, Go & Web SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Lint and generate Protobuf stubs
        run: |
          buf lint
          buf generate

      - name: Go vet, test, and build
        run: |
          go vet ./...
          go test -race ./...
          go build -o bin/lumavault ./cmd/lumavault

      - name: Web SDK typecheck, test, and build
        run: |
          npm --prefix sdk/web install --no-package-lock
          npm --prefix sdk/web run typecheck
          npm --prefix sdk/web test
          npm --prefix sdk/web run build

  swift:
    name: Swift SDK
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Protobuf stubs
        run: buf generate

      - name: Build and test Swift SDK
        run: swift test
