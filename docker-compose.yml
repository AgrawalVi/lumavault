# Shared local PostgreSQL for the Photos, Cinema, and Arcade application schemas.
# Credentials default to local-dev values; override them in a gitignored .env file.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lumavault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumavault}
      POSTGRES_DB: ${POSTGRES_DB:-lumavault}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/01-schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
