version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/lumavault/lumavault/gen/go
plugins:
  # Go Protobuf & Connect-RPC server/client stubs
  - remote: buf.build/protocolbuffers/go
    out: gen/go
    opt:
      - paths=source_relative
  - remote: buf.build/connectrpc/go
    out: gen/go
    opt:
      - paths=source_relative

  # Web / TypeScript Protobuf v2 & Connect-ES service descriptors
  - remote: buf.build/bufbuild/es
    out: sdk/web/src/gen
    opt:
      - target=ts

  # Swift Protobuf & Connect-Swift client stubs
  - remote: buf.build/apple/swift
    out: sdk/swift/Sources/LumaVaultSDK/Gen
    opt:
      - Visibility=Public
  - remote: buf.build/connectrpc/swift
    out: sdk/swift/Sources/LumaVaultSDK/Gen
    opt:
      - Visibility=Public
